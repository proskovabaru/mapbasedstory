<!DOCTYPE html>
<html>
    <head>
            <title>News map</title>

            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.3/dist/leaflet.css"
            integrity="sha512-Rksm5RenBEKSKFjgI3a41vrjkw4EVPlJ3+OiI65vTjIdo9brlAacEuKOiQ5OFh7cOI1bkDwLqdLw3Zg0cRJAAQ=="
            crossorigin=""/>

            <!-- Make sure you put this AFTER Leaflet's CSS -->
            <script src="https://unpkg.com/leaflet@1.3.3/dist/leaflet.js"
            integrity="sha512-tAGcCfR4Sc5ZP5ZoVz0quoZDYX5aCtEm/eu1KhSLj2c9eFrylXZknQYmxUssFaVJKvvc0dJQixhGjG2yXWiV9Q=="
            crossorigin="">
            </script>
            <!--The following style tag contains CSS for altering the appearance of the textbox on narrow screens-->
            <!--The 500px value on line 33 determines at what width the textbox will cover the entire width of the map-->
             <style>
                #textbox{
                    position: absolute;
                    border-radius: 2px;
                    font-family: sans-serif;
                    top: 20px;
                    left: 20px;
                    max-width: 200px;
                    z-index: 1003;
                    background: white;
                    box-shadow: 0px 0px 2px 2px rgba(0, 0, 0, 0.2);  
                    }

                  #txtcontainer{
                    width: 90%;
                  }
                  #markerDetails{
                    display: flex;
                    align-items: flex-start;
                    gap: 8px;
                  }
                  #mapDescription{
                    flex: 1;
                    min-width: 0;
                  }
                  #markerImage{
                    width: 38%;
                    height: auto;
                    margin-top: 8px;
                  }
                  #markerlink{
                    margin-left: 10px;

                  }
                

                @media (max-width: 500px) {
                    #textbox{
                        top: 0px;
                        left: 8px;
                        display: inline-block;
                        max-width: calc(100% - 16px);
                        width: calc(100% - 16px);
                        box-shadow: 0px 2px 2px 0px rgba(0, 0, 0, 0.2);
                    }

                    #txtcontainer{
                      overflow:auto;
                      width: 100%;
                    }
                }

                a{
                    
                    
                }

                #mapTitle{
                    padding: 6px 10px 6px 10px;
                    margin: 0px;
                }
                #mapDescription{
                    padding: 0px 10px 6px 10px;
                    margin: 0px;
                             }           
                </style>
          

    </head>
    <body>
        <div id='textbox'>
          <div id="txtcontainer">
            <h3 id="mapTitle">Map title</h3>
            <div id="markerDetails">
              <p id="mapDescription">Initial map description. Replace this with your own description of your map</p>
              <img id="markerImage" alt="" style="display: none;">
            </div>
          </div>
            <div id="legende">
            </div>
          </div>
        <div id="mapid" style="width: 100%; height: 400px;"></div>
        <script type="text/javascript">

            //GEOJSON START

          let myGeoJson = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "THE OLD TOWN SQUARE",
        "title": "THE OLD TOWN SQURE",
        "descr": "Add a description for marker 1.",
        "imgUrl": "https://bapro0029.azurewebsites.net/wp-content/uploads/2026/10/8109522.jpg"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.4209757,
          50.087612
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "OLD-NEW SYNAGOGUE",
        "title": "OLD-NEW SYNAGOGUE",
        "descr": "Add a description for marker 2.",
        "imgUrl": "https://bapro0029.azurewebsites.net/wp-content/uploads/2026/10/OIP.webp"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.417668,
          50.0902612
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "OLD JEWISH CEMETERY",
        "title": "OLD JEWISH CEMETERY",
        "descr": "Add a description for marker 3.",
        "imgUrl": "https://bapro0029.azurewebsites.net/wp-content/uploads/2026/10/HRBITOV.jpg"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.4174701,
          50.0893442
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "Marker 4",
        "title": "Marker 4",
        "descr": "Add a description for marker 4.",
        "imgUrl": ""
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.415883,
          50.0866898
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "Marker 5",
        "title": "Marker 5",
        "descr": "Add a description for marker 5.",
        "imgUrl": ""
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.4114816,
          50.0864869
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "Marker 6",
        "title": "Marker 6",
        "descr": "Add a description for marker 6.",
        "imgUrl": ""
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.3950527,
          50.0835324
        ]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "shortDescr": "Marker 7",
        "title": "Marker 7",
        "descr": "Add a description for marker 7.",
        "imgUrl": ""
      },
      "geometry": {
        "type": "Point",
        "coordinates": [
          14.4293171,
          50.0675708
        ]
      }
    }
  ]
}

            //GEOJSON END

            let map = L.map('mapid').setView([50.07820605210975, 14.433842183928384], 11);

            //You can swap map tiles by commenting in/out the code below. 
            //You can also copy various tile codes from the following url. Some providers require you register to get a token:
            //https://leaflet-extras.github.io/leaflet-providers/preview/
            //When copying into this leaflet map start with 'L.Tilelayer....'
            //Add '.addTo(map)' before the semicolon as seen in the functioning codes below
            /*
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            */
            /*
            L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', {
              maxZoom: 20,
              attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors'
            }).addTo(map);*/

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
              attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
              maxZoom: 16
            }).addTo(map);


            map.zoomControl.setPosition('bottomleft');
                     
            function markerClicked(evt) {
                
               //console.log(evt.target);
                const props = evt.target.feature.properties || {};
                document.getElementById("mapTitle").textContent = props.title || "";
                document.getElementById("mapDescription").textContent = props.descr || "";
                var imgcontainer;
                var loadimage = false;
                if (evt.target.feature.properties.linkUrl){
                    if (document.getElementById("markerlink") == null){
                        let myLink = document.createElement('A');
                        myLink.setAttribute("id", "markerlink");
                        //myLink.setAttribute("margin-left", "12px");
                        let linkText = document.createTextNode(evt.target.feature.properties.linkTitle);
                        myLink.appendChild(linkText);
                        //myLink.setAttribute("href", evt.target.feature.properties.linkUrl);
                        myLink.href = evt.target.feature.properties.linkUrl;
                        
                        myLink.setAttribute('target', '_blank'); // if it doesn't, set attributes
                        
                        document.getElementById("txtcontainer").appendChild(myLink);
                    } else {
                      let myLink = document.getElementById("markerlink");
                      let linkText = document.createTextNode(evt.target.feature.properties.linkTitle);
                      myLink.innerText = "";
                      myLink.appendChild(linkText);
                      myLink.href = evt.target.feature.properties.linkUrl;
                    }
                }else{
                  if (document.getElementById("markerlink") != null){
                    document.getElementById("txtcontainer").removeChild(document.getElementById("markerlink"));
                  }
                }
                    
                    
                const markerImage = document.getElementById("markerImage");
                if (props.imgUrl) {
                  markerImage.src = props.imgUrl;
                  markerImage.alt = props.title || "Marker image";
                  markerImage.style.display = "block";
                } else {
                  markerImage.removeAttribute("src");
                  markerImage.alt = "";
                  markerImage.style.display = "none";
                }
            }

            //This is a function for activating your geojson data in the map
            let layerGroup = L.geoJSON([], {
                onEachFeature: function (feature, layer) {
                    var props = feature.properties;
                    if (props.shortDescr) {
                      layer.bindTooltip(props.shortDescr);
                    }
                    layer.on({
                    click: markerClicked
                    });

                    layer.title = props.title;

                    layer.descr = props.descr;
                   
                }
            }).addTo(map);
            
            layerGroup.addData(myGeoJson);
           
            //The following function is for development only, it logs lat, lng and zoomlevel to the console
            //for simpler setting of center and zoom level. It is commented out by default.
            //This function runs on the event zoomend, meaning when the map is done zooming the function is called.
            function onMapClick(e) {
                console.log(e.latlng.toString()+"  zoom level : "+map.getZoom());
                    
            }
            map.on('click', onMapClick);    

            
        </script>
    </body>
</html>
